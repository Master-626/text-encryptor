[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "text-encryptor"
version = "0.1.0"
description = "A secure text encryption and decryption tool with AES support"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }
]
keywords = ["encryption", "decryption", "aes", "security", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "click>=8.0.0",
    "cryptography>=41.0.0",
]

[project.scripts]
text-encryptor = "text_encryptor.cli:main"
texenc = "text_encryptor.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Master-626/text-encryptor"
Repository = "https://github.com/Master-626/text-encryptor"
Issue-Tracker = "https://github.com/Master-626/text-encryptor/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]

[tool.ruff.lint.isort]
known-first-party = ["text_encryptor"]
