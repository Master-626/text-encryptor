name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.8 builds are available for Ubuntu 24.04, not 26.04.
          - os: ubuntu-24.04
            python: "3.8"
            minimum: true
          - os: ubuntu-latest
            python: "3.12"
            minimum: false
          - os: ubuntu-latest
            python: "3.13"
            minimum: false
          - os: windows-latest
            python: "3.12"
            minimum: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - if: matrix.minimum
        run: python -m pip install "click==8.0.0" "cryptography==41.0.0" "pytest==7.0.0"
      - run: python -m pytest -q
      - run: text-encryptor --help
      - run: texenc --help
